/* Full-screen map chrome and right-side overlay. */
html,body,#workspace{width:100%;height:100%;overflow:hidden}
#workspace{position:relative;background:#dce7e3}
.map{position:absolute;inset:0;width:100%;height:100%;min-height:0;border:0}

#tiles img{position:absolute;left:0;top:0;max-width:none}
#tiles.ready~#labels{display:none}
.navigation{position:absolute;z-index:7;top:15px;left:15px;display:grid;gap:8px}
.navigation button.square,.navigation .zoom-controls button,.bottom-tools .square{width:36px;height:36px;padding:0;box-shadow:0 1px 4px #28413720}
.navigation .zoom-controls button{box-shadow:none}
.navigation .zoom-controls button:last-child{border-top:0}
.bottom-tools{position:absolute;z-index:7;bottom:17px;left:15px;display:flex;gap:6px;align-items:center}
.bottom-tools button[aria-pressed=true]{background:#d9eadf;border-color:#7f9f8c}
.control-wrap{position:relative}
.lower-pop{position:absolute;bottom:calc(100% + 8px);left:0;padding:5px;min-width:max-content}
.lower-pop button{width:100%;justify-content:flex-start;margin:2px 0;font-size:12px}
.lower-pop button[aria-pressed=true]{background:#e4eee3;border-color:#a5c0ab}
#legendPop{padding:8px 10px;max-height:55vh;overflow:auto}
#workspace>.map-meta{position:absolute;right:8px;bottom:7px;z-index:5;pointer-events:none}
#workspace>.map-meta a{pointer-events:auto;text-decoration:none}
.attribution{background:#fffdf5d9;font-size:9px;max-width:54vw;text-align:right}
.finder{position:absolute;left:43px;top:0;width:min(315px,calc(100vw - 65px));padding:8px}
.finder input{width:100%;padding:8px;border:1px solid #cbd9cd;border-radius:6px;margin-bottom:7px;background:#fff}
